<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星环乱斗</title><meta name="description" content="原创平台格斗游戏：跳跃、出招，把对手击飞出场。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1024'/%3E%3Cpath d='M7 22L16 6l9 16H7' fill='none' stroke='%2353e4ff' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main><header><div class="brand"><span class="mark">✦</span><div>星环乱斗<small>NEON BRAWL</small></div></div><div class="tools"><label>对战 <select id="mode"><option value="cpu">挑战电脑</option><option value="local">本地双人</option></select></label><button id="sound" aria-pressed="false">音效：关</button><button id="pause">暂停</button></div></header><section class="arena" aria-label="格斗竞技场"><div class="topline"><span>轨道竞技场 <i>01</i></span><span id="timer">03:00</span><span>3 条命 · 击飞制</span></div><canvas id="game" width="1200" height="680" tabindex="0" aria-label="星环乱斗。使用 A D 移动，W 跳跃，鼠标左键攻击，鼠标右键重击，L 护盾。"></canvas><div id="overlay"><div class="eyebrow">准备登场</div><h1>把对手打出星环。</h1><p>伤害越高，击飞越远。守住你的最后一条命。</p><button id="start" class="primary">开始对战 <span>ENTER</span></button><p class="hint">二段跳可以帮你返回舞台</p></div><div class="scores"><div class="fighter cyan"><div><span>01 / 玩家</span><strong>脉冲</strong></div><b id="d0">0<span>%</span></b><em id="s0">● ● ●</em></div><div class="vs">VS</div><div class="fighter pink"><div><span id="p2label">02 / 电脑</span><strong>焰核</strong></div><b id="d1">0<span>%</span></b><em id="s1">● ● ●</em></div></div></section><div class="touch"><button data-key="a">◀</button><button data-key="d">▶</button><button data-key="w">跳跃</button><button data-key="mouseattack">攻击</button><button data-key="mouseheavy">重击</button><button data-key="l">护盾</button></div><footer><div><span class="tag">操作指南</span><span><kbd>A</kbd><kbd>D</kbd> 移动</span><span><kbd>W</kbd> 二段跳</span><span><kbd>鼠标左键</kbd> 攻击</span><span><kbd>鼠标右键</kbd> 重击</span><span><kbd>L</kbd> 护盾</span></div><p id="note">先消耗对手，再用重击完成击飞。<br>Enter 开始 / 重开 · Esc 暂停</p></footer><div id="localhelp" hidden>玩家 2：← → 移动 · ↑ 二段跳 · 数字 1 攻击 · 2 重击 · 3 护盾</div></main><script src="game.js"></script></body></html>
